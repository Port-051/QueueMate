# Redis Sentinel (docs/07 §11).
#
# master가 죽으면 replica 하나를 승격한다. 정족수는 3대 중 2대다.
# 2대로 하면 한 대만 고장 나도 정족수를 못 채우거나, 반대로 분단 상황에서 양쪽이
# 각자 master를 세울 수 있다.

port 26379
bind 0.0.0.0
protected-mode no

# compose 서비스 이름으로 서로를 찾는다. IP만 쓰면 컨테이너가 재시작할 때마다 어긋난다.
sentinel resolve-hostnames yes
sentinel announce-hostnames yes

sentinel monitor queuemate redis-master 6379 2
sentinel down-after-milliseconds queuemate 5000
sentinel failover-timeout queuemate 10000

# 한 번에 하나씩만 새 master와 동기화시킨다. 한꺼번에 시키면 그동안 읽기가 전부 막힌다.
sentinel parallel-syncs queuemate 1
