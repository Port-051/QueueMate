# Sentinel 토폴로지의 master (docs/07 §11).
bind 0.0.0.0
protected-mode no
appendonly yes
appendfsync everysec
save 60 1000

# 복제가 따라오지 못하는 동안에는 write를 거부한다.
#
# 매칭의 INV-1/INV-2 guard는 Redis write 하나에 걸려 있다. 복제되지 않은 채 ack된 write는
# failover 때 사라지고, 그러면 새 master는 그 사용자가 비어 있다고 답한다.
# 잠깐 매칭을 못 받는 쪽이 같은 사람을 두 파티에 넣는 것보다 낫다. INV-10의 fail-closed와 같은 판단이다.
#
# 이것으로 창이 0이 되지는 않는다. 최후의 방어선은 active_proposal_claims의 PK다 (V3).
min-replicas-to-write 1
min-replicas-max-lag 10
