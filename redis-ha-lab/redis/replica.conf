# replica 템플릿. master.conf 와 같은 규칙이다 (entrypoint.sh 가 치환·복사).
#
# replicaof 는 최초 1회만 이 값이다. 그 뒤로는 Sentinel 이 REPLICAOF 명령으로
# 바꾸고 CONFIG REWRITE 로 /data/redis.conf 에 적는다. 그래서 이 파일이 아니라
# 복사본이 원본이 되어야 한다.

port 6379
protected-mode no

replicaof __MASTER_IP__ __MASTER_PORT__

replica-announce-ip __ANNOUNCE_IP__
replica-announce-port __ANNOUNCE_PORT__

# replica 는 읽기 전용이다. 실험 4 에서 "승격된 replica 에 락이 다시 잡히는가" 를
# 보려면 승격 전에는 쓰기가 막혀 있어야 관측이 깨끗하다.
replica-read-only yes

save ""
appendonly no
repl-diskless-sync yes
repl-diskless-load on-empty-db

min-replicas-to-write __MIN_REPLICAS_TO_WRITE__
min-replicas-max-lag __MIN_REPLICAS_MAX_LAG__

loglevel notice
