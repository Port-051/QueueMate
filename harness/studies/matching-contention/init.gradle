allprojects {
    plugins.withId('java') {
        sourceSets.test.java.srcDir(rootProject.file('../harness/studies/matching-contention'))
        tasks.register('matchingContentionStudy', Test) {
            dependsOn tasks.named('testClasses')
            testClassesDirs = sourceSets.test.output.classesDirs
            classpath = sourceSets.test.runtimeClasspath
            useJUnitPlatform()
            filter { includeTestsMatching 'com.queuemate.api.MatchingContentionStudy' }
            systemProperty 'spring.profiles.active', 'test'
            systemProperty 'api.version', System.getenv('DOCKER_API_VERSION') ?: '1.41'
            systemProperty 'study.output', System.getProperty('study.output', '/private/tmp/queuemate-matching-contention')
            environment tasks.named('test').get().environment
            reports.html.outputLocation = file(System.getProperty('study.output', '/private/tmp/queuemate-matching-contention') + '/report')
            reports.junitXml.outputLocation = file(System.getProperty('study.output', '/private/tmp/queuemate-matching-contention') + '/xml')
            outputs.upToDateWhen { false }
        }
    }
}
