# Separate ports/volumes so the two-account pilot never touches another project's database.
name: queuemate-room-demo
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: queuemate
      POSTGRES_USER: queuemate
      POSTGRES_PASSWORD: queuemate
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["room-demo-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queuemate"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  room-demo-postgres:
