# T-B 오버레이 - 컨테이너 네트워크 안에서만 도는 토폴로지.
#
#   docker compose -f docker-compose.yml -f docker-compose.netpart.yml up -d
#
# 기본 토폴로지(T-A)와 딱 두 가지가 다르다.
#   1. 모든 노드가 자기 주소를 컨테이너 고정 IP(172.31.31.x)로 알린다
#   2. 앱도 컨테이너로 같이 뜬다 (프로파일 app)
#
# 왜 따로 두나: `docker network disconnect` 로 master 를 격리하는 실험(실험 5)은
# T-A 에서 성립하지 않는다. T-A 는 노드끼리도 호스트 IP + 포트 포워딩으로
# 서로를 찾기 때문에, 네트워크에서 떼어내는 순간 격리된 master 에 아무도 못 붙는다.
# 스플릿 브레인은 "구 master 는 살아 있고 일부 클라이언트가 그쪽에 계속 쓴다" 가
# 성립해야 재현되는데, 그러려면 클라이언트도 같은 네트워크 안에 있어야 한다.
#
# 대신 T-B 에서는 호스트에서 IDE 로 띄운 앱이 Sentinel 이 알려 준 주소로 못 붙는다.
# 관측은 전부 `docker exec` 로 한다.

x-netpart-sentinel-env: &netpart-sentinel-env
  MASTER_IP: 172.31.31.11
  MASTER_PORT: 6379
  QUORUM: ${QUORUM:-2}
  DOWN_AFTER: ${DOWN_AFTER:-5000}
  FAILOVER_TIMEOUT: ${FAILOVER_TIMEOUT:-60000}
  PARALLEL_SYNCS: ${PARALLEL_SYNCS:-1}

services:

  qm-ha-master:
    environment:
      TEMPLATE: master.conf
      ANNOUNCE_IP: 172.31.31.11
      ANNOUNCE_PORT: 6379
      MIN_REPLICAS_TO_WRITE: ${MIN_REPLICAS_TO_WRITE:-0}
      MIN_REPLICAS_MAX_LAG: ${MIN_REPLICAS_MAX_LAG:-10}

  qm-ha-replica1:
    environment:
      TEMPLATE: replica.conf
      ANNOUNCE_IP: 172.31.31.12
      ANNOUNCE_PORT: 6379
      MASTER_IP: 172.31.31.11
      MASTER_PORT: 6379
      MIN_REPLICAS_TO_WRITE: ${MIN_REPLICAS_TO_WRITE:-0}
      MIN_REPLICAS_MAX_LAG: ${MIN_REPLICAS_MAX_LAG:-10}

  qm-ha-replica2:
    environment:
      TEMPLATE: replica.conf
      ANNOUNCE_IP: 172.31.31.13
      ANNOUNCE_PORT: 6379
      MASTER_IP: 172.31.31.11
      MASTER_PORT: 6379
      MIN_REPLICAS_TO_WRITE: ${MIN_REPLICAS_TO_WRITE:-0}
      MIN_REPLICAS_MAX_LAG: ${MIN_REPLICAS_MAX_LAG:-10}

  qm-ha-sentinel1:
    environment:
      <<: *netpart-sentinel-env
      ANNOUNCE_IP: 172.31.31.21
      ANNOUNCE_PORT: 26379

  qm-ha-sentinel2:
    environment:
      <<: *netpart-sentinel-env
      ANNOUNCE_IP: 172.31.31.22
      ANNOUNCE_PORT: 26380

  qm-ha-sentinel3:
    environment:
      <<: *netpart-sentinel-env
      ANNOUNCE_IP: 172.31.31.23
      ANNOUNCE_PORT: 26381

  # 앱을 컨테이너로 띄운다. 프로파일이 붙어 있으므로 기본 up 에는 안 뜬다.
  #   ./gradlew bootJar                                     (matching/backend 에서)
  #   docker compose -f docker-compose.yml -f docker-compose.netpart.yml \
  #     --profile app up -d
  #
  # Dockerfile 을 만들지 않는다 - 기존 저장소에 파일을 추가하지 않기로 했다.
  # 대신 빌드 산출물 디렉터리를 읽기 전용으로 물려서 JRE 이미지가 그대로 실행한다.
  #
  # 주의: SPRING_DATA_REDIS_SENTINEL_* 만으로는 절반만 바뀐다.
  # Redisson(= 분산 락)은 RedissonConfig.java 가 useSingleServer() 를 자바 코드로
  # 박아 두었기 때문에 환경변수로 Sentinel 을 못 태운다.
  # 무엇을 어떻게 고쳐야 하는지는 docs/app-config-snippets.md 에 적었다.
  qm-ha-app:
    image: eclipse-temurin:21-jre
    container_name: qm-ha-app
    profiles: ["app"]
    restart: "no"
    working_dir: /app
    command: ["sh", "-c", "exec java -jar /app/$${JAR_NAME}"]
    environment:
      JAR_NAME: ${JAR_NAME:-matching-0.0.1-SNAPSHOT.jar}
      SERVER_PORT: 8080
      # Lettuce(StringRedisTemplate) 쪽은 이 두 개면 코드 수정 없이 Sentinel 을 탄다.
      SPRING_DATA_REDIS_SENTINEL_MASTER: mymaster
      SPRING_DATA_REDIS_SENTINEL_NODES: 172.31.31.21:26379,172.31.31.22:26380,172.31.31.23:26381
      # RedissonConfig 가 @Value 로 이 둘을 필수로 읽는다 (RedissonConfig.java:29-30).
      # 없으면 컨텍스트 로딩부터 실패하므로 남겨 둔다.
      SPRING_DATA_REDIS_HOST: 172.31.31.11
      SPRING_DATA_REDIS_PORT: "6379"
    volumes:
      - ../backend/build/libs:/app:ro
    ports:
      - "18080:8080"
    depends_on:
      - qm-ha-sentinel1
      - qm-ha-sentinel2
      - qm-ha-sentinel3
    networks:
      qm-ha:
        ipv4_address: 172.31.31.31
