# Sentinel 템플릿 한 벌. 세 노드가 포트만 달리해서 같은 파일을 쓴다.
# entrypoint.sh 가 치환해서 /data/sentinel.conf 로 복사한 뒤 그 파일로 기동한다.
#
# 이 파일을 컨테이너에 직접 물리면 안 되는 이유는 master.conf 보다 심각하다.
# Sentinel 은 기동 직후부터 이 파일에 myid, known-sentinel, known-replica,
# current-epoch 을 계속 써 넣는다. 페일오버가 나면 sentinel monitor 줄의
# 주소 자체가 새 master 로 바뀐다. 즉 이 파일은 설정이 아니라 상태 저장소다.

port __ANNOUNCE_PORT__
protected-mode no

# Sentinel 이 자기를 다른 Sentinel 에게 알릴 때 쓰는 주소.
# 이 값이 틀리면 Sentinel 끼리 서로를 못 찾아 정족수(quorum)가 영영 안 찬다.
# 증상은 "SENTINEL sentinels mymaster 가 빈 배열" 이다.
sentinel announce-ip __ANNOUNCE_IP__
sentinel announce-port __ANNOUNCE_PORT__

# 호스트명을 주소로 받지 않는다. compose 서비스명(qm-ha-master 등)을 쓰면
# 호스트에서 IDE 로 띄운 앱이 그 이름을 해석하지 못한다.
sentinel resolve-hostnames no
sentinel announce-hostnames no

# monitor 는 아래 세 지시자보다 먼저 와야 한다. 순서를 바꾸면 기동이 실패한다.
sentinel monitor mymaster __MASTER_IP__ __MASTER_PORT__ __QUORUM__

# master 가 몇 ms 응답이 없으면 이 Sentinel 이 주관적 다운(SDOWN)으로 볼지.
# 실험 3 이 이 값을 바꿔 가며 감지 속도와 오탐을 잰다.
sentinel down-after-milliseconds mymaster __DOWN_AFTER__

# 페일오버 한 번에 허용하는 시간. 이 시간 안에 안 끝나면 다른 Sentinel 이
# 다시 시도한다. 짧게 잡으면 재시도가 겹쳐 페일오버가 오히려 늦어진다.
sentinel failover-timeout mymaster __FAILOVER_TIMEOUT__

# 새 master 로 동시에 재동기화시킬 replica 수. 1 이면 한 대씩 붙인다.
# 크게 잡으면 복구는 빠르지만 그동안 replica 들이 동시에 응답 불가가 된다.
sentinel parallel-syncs mymaster __PARALLEL_SYNCS__

loglevel notice
