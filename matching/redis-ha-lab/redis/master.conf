# master 템플릿. entrypoint.sh 가 __PLACEHOLDER__ 를 치환해서
# /data/redis.conf 로 복사한 뒤 그 파일로 기동한다.
#
# 이 파일을 컨테이너에 직접 물리지 마라 — Sentinel 이 페일오버할 때
# CONFIG REWRITE 로 이 파일을 고쳐 쓴다 (replicaof 줄이 붙는다).
# 바인드 마운트한 원본이 고쳐지면 호스트의 git 작업 트리가 더러워지고,
# 다음 up 이 "이미 replica 인 master" 로 시작해 토폴로지가 깨진다.

port 6379

# 컨테이너 안이라 방화벽이 없다. bind 지시자를 안 쓰면 전 인터페이스에 붙지만
# protected-mode 가 기본 yes 라 외부 접속이 막힌다. 실험 환경이므로 끈다.
protected-mode no

# 이 노드가 자기 주소를 남에게 알릴 때 쓰는 값.
# Sentinel 은 master 의 INFO replication 에 찍힌 slaveN:ip=... 를 그대로 믿고
# 그 주소로 접속한다. 여기가 컨테이너 내부 주소면 호스트의 앱이 못 붙는다.
# 어떤 값을 넣어야 하는지는 README.md "토폴로지를 왜 이렇게 잡았나" 를 보라.
replica-announce-ip __ANNOUNCE_IP__
replica-announce-port __ANNOUNCE_PORT__

# 실험 편의. 디스크 상태가 남으면 "구 master 복귀 시 write 유실"(실험 5)에서
# 유실된 것이 복제 때문인지 RDB 로드 때문인지 구분이 안 된다.
save ""
appendonly no

# 승격 직후 full sync 가 디스크를 거치지 않게 한다. 노트북에서 복구가 빨라진다.
repl-diskless-sync yes
repl-diskless-load on-empty-db

# 실험 4 에서 켠다. 0 이면 꺼진 것이다 (기본값 0 = 제한 없음).
min-replicas-to-write __MIN_REPLICAS_TO_WRITE__
min-replicas-max-lag __MIN_REPLICAS_MAX_LAG__

# 페일오버 타임라인을 초 단위로 읽으려면 로그에 시각이 찍혀야 한다.
loglevel notice
