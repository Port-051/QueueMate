spring:
  application:
    name: queuemate
  profiles:
    # 프로파일을 안 주고 띄우면 local이다. 운영은 SPRING_PROFILES_ACTIVE=prod로 명시한다.
    default: local
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  servlet:
    multipart:
      # 계약상 한도는 5MiB다. 컨테이너 쪽은 약간 위에 둔다. 멀티파트 헤더 때문에
      # 정확히 5MiB짜리 파일의 요청 전체는 5MiB를 조금 넘는다.
      max-file-size: 5MB
      max-request-size: 6MB

server:
  tomcat:
    # 한도를 넘은 업로드에 413을 돌려주려면 남은 본문을 끝까지 읽어서 버려야 한다.
    # 기본값(2MiB)이면 5MiB 초과 요청에서 Tomcat이 먼저 연결을 끊고, 클라이언트는
    # 413 대신 네트워크 오류를 본다. 요청 한도(6MiB)보다 조금 위에 둔다.
    # 무제한으로 두지는 않는다. 그러면 거절하기로 한 요청을 끝까지 받아 주게 된다.
    max-swallow-size: 8MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

queuemate:
  avatar:
    # 업로드된 프로필 사진. 컨테이너 안 경로이고 운영에서는 볼륨을 붙인다.
    dir: ${AVATAR_DIR:/var/lib/queuemate/avatars}
    max-upload-size: ${AVATAR_MAX_UPLOAD_SIZE:5MB}
    # 목록에서 38px, 내 정보에서 64px로 쓴다. 2배 화면까지 감안해 512로 저장한다.
    edge-pixels: ${AVATAR_EDGE_PIXELS:512}
    # 파일은 작아도 펼치면 큰 이미지를 거른다. 8000x5000 정도까지는 통과한다.
    max-source-pixels: ${AVATAR_MAX_SOURCE_PIXELS:40000000}
  riot:
    # 개발자 키는 24시간마다 만료된다. 비어 있거나 죽어 있으면 티어를 비워 둘 뿐
    # 계정 연결은 그대로 된다. 저장소에 두지 않는다 (docs/13).
    api-key: ${RIOT_API_KEY:}
    # Riot ID를 puuid로 바꾸는 account-v1은 대륙 라우팅이다. 한국은 asia.
    account-base-url: ${RIOT_ACCOUNT_BASE_URL:https://asia.api.riotgames.com}
    # 리그 정보는 플랫폼 라우팅이다. 한국은 kr.
    platform-base-url: ${RIOT_PLATFORM_BASE_URL:https://kr.api.riotgames.com}
    connect-timeout: ${RIOT_CONNECT_TIMEOUT:2s}
    # 계정 연결 응답이 이만큼 이상 늦어지지 않게 한다.
    read-timeout: ${RIOT_READ_TIMEOUT:3s}
    rank-ttl: ${RIOT_RANK_TTL:6h}
    # 언랭은 흔하고 잘 바뀌지 않는다. 매번 되묻지 않는다.
    unranked-ttl: ${RIOT_UNRANKED_TTL:24h}
  oauth:
    # 제공자 콜백을 받은 뒤 브라우저를 돌려보낼 프론트엔드 주소.
    frontend-callback-uri: ${OAUTH_FRONTEND_CALLBACK_URI:http://localhost:5173/auth/callback}
    default-redirect-path: /app/home
    # 동의 화면에 머무는 시간을 감안한다. 너무 길면 재사용 위험이 커진다.
    state-ttl-seconds: ${OAUTH_STATE_TTL_SECONDS:300}
    # 콜백에서 프론트엔드가 토큰을 받아가기까지의 시간. 한 번만 쓸 수 있다.
    handoff-ttl-seconds: ${OAUTH_HANDOFF_TTL_SECONDS:60}
    # 기본은 끈다. 운영에서 누르면 실패할 버튼을 그리지 않기 위해서다. local에서만 켠다.
    expose-unconfigured-providers: ${OAUTH_EXPOSE_UNCONFIGURED:false}
    providers:
      # client-id가 비어 있으면 그 제공자는 목록에 뜨지 않는다. secret은 저장소에 두지 않는다.
      kakao:
        client-id: ${KAKAO_CLIENT_ID:}
        client-secret: ${KAKAO_CLIENT_SECRET:}
        redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/v1/auth/oauth/kakao/callback}
        authorization-uri: https://kauth.kakao.com/oauth/authorize
        token-uri: https://kauth.kakao.com/oauth/token
        user-info-uri: https://kapi.kakao.com/v2/user/me
        # 이메일 동의항목은 비즈 앱 검수를 요구할 수 있다. 막히면 profile_nickname만 남긴다.
        # 이메일이 없으면 계정은 이메일 없이 만들어진다(V4에서 NULL을 허용한 이유다).
        scope: ${KAKAO_SCOPE:profile_nickname,account_email}
      naver:
        client-id: ${NAVER_CLIENT_ID:}
        client-secret: ${NAVER_CLIENT_SECRET:}
        redirect-uri: ${NAVER_REDIRECT_URI:http://localhost:8080/api/v1/auth/oauth/naver/callback}
        authorization-uri: https://nid.naver.com/oauth2.0/authorize
        token-uri: https://nid.naver.com/oauth2.0/token
        user-info-uri: https://openapi.naver.com/v1/nid/me
      dev:
        # 가짜 제공자. 빈 자체가 local/test 프로파일에서만 등록된다.
        redirect-uri: ${DEV_OAUTH_REDIRECT_URI:http://localhost:8080/api/v1/auth/oauth/dev/callback}
  redis:
    circuit:
      # 연속 몇 번 실패해야 죽었다고 볼 것인가. 명령 타임아웃이 2초라 한 번의 실패가
      # 이미 2초짜리 사건이다. 세 번 연속이면 우연으로 보기 어렵다.
      failure-threshold: ${REDIS_CIRCUIT_FAILURE_THRESHOLD:3}
      # 시도를 멈추고 기다리는 시간. Sentinel down-after와 같다. 그보다 일찍 확인해 봐야
      # Sentinel이 아직 죽었다는 판정도 내리지 않은 시점이다.
      open-ms: ${REDIS_CIRCUIT_OPEN_MS:5000}
  matching:
    # 참가자별 선점 작업 락의 임대. 만료되면 WATCH가 오래된 작업의 저장을 거부한다.
    claim-lock-lease-ms: ${MATCH_CLAIM_LOCK_LEASE_MS:10000}
    # 매칭은 대기열이 변한 순간 돈다. 아래는 그 trigger를 잃었을 때를 위한 안전망 주기다.
    # 여기서 제안이 만들어진다면 주기를 줄일 것이 아니라 왜 trigger를 잃었는지 봐야 한다.
    sweep-ms: ${MATCH_SWEEP_MS:15000}
    # 매칭을 요청 스레드가 아니라 여기서 돈다. 대기열이 길어도 요청 응답이 느려지지 않는다.
    trigger-threads: ${MATCH_TRIGGER_THREADS:4}
    trigger-queue: ${MATCH_TRIGGER_QUEUE:512}
  proposal:
    ttl-seconds: ${PROPOSAL_TTL_SECONDS:20}
  reservation:
    sweep-ms: ${RESERVATION_SWEEP_MS:30000}
  party:
    # 전원 준비가 이만큼 유지되면 게임에 들어갔다고 본다.
    # 서버는 게임을 관측할 수 없어서 시간으로 추정한다. 근거는 PartyLifecycleProperties 주석에 있다.
    play-start-delay-seconds: ${PLAY_START_DELAY_SECONDS:120}
    # 게임 중으로 이만큼 남아 있으면 방치로 보고 닫는다. 6시간이다.
    max-play-seconds: ${MAX_PLAY_SECONDS:21600}
    sweep-ms: ${PARTY_SWEEP_MS:30000}
  presence:
    # 연결이 끊긴 뒤 이탈로 판정하기까지 기다리는 시간. 파티 상태마다 다르다.
    # 게임 전은 기다리는 비용이 크고, 게임 중은 잘못 내보내는 비용이 크다.
    # 세 값의 근거는 PresenceProperties 주석에 있다.
    departure-grace-seconds: ${DEPARTURE_GRACE_SECONDS:10}
    ready-grace-seconds: ${READY_GRACE_SECONDS:60}
    playing-grace-seconds: ${PLAYING_GRACE_SECONDS:300}
    sweep-ms: ${DEPARTURE_SWEEP_MS:10000}
    # 파티 멤버와 접속 여부를 대조하는 주기. 서버가 강제 종료되면 이탈 예약 자체가
    # 안 걸리는데, 그것을 뒤늦게라도 찾아내는 수리 작업이다.
    reconcile-ms: ${PRESENCE_RECONCILE_MS:60000}

# 로그 레벨/포맷은 logback-spring.xml이 프로파일별로 정한다.
# 여기에 logging.level.* 을 넣으면 그 설정을 덮어쓰니 넣지 않는다.
