# 자동화 테스트. datasource/redis는 Testcontainers가 @DynamicPropertySource로 덮어쓴다.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/queuemate-test-placeholder
    username: test
    password: test
  data:
    redis:
      host: localhost
      port: 6379

queuemate:
  auth:
    jwt-secret: test-secret-key-that-is-long-enough-32b
    # 만료 검증 테스트가 실시간을 기다리지 않도록 짧게 둔다.
    access-token-ttl-seconds: 60
    refresh-token-ttl-seconds: 300
  presence:
    # 대조 작업은 테스트에서 스스로 돌지 않게 한다. 스케줄러가 임의의 시점에 끼어들면
    # 다른 테스트가 만들어 둔 파티를 정리해 버려서 실패가 재현되지 않는다.
    # 검증은 테스트가 reconcile()을 직접 불러서 한다.
    reconcile-ms: 3600000
