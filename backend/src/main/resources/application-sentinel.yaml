# ====================================================================
# [실험용] Redis Sentinel 구성 - 이 프로파일이 켜졌을 때만 읽힌다.
#
# 왜 application.yaml 이 아니라 별도 파일인가:
#   Spring Boot 는 spring.data.redis.sentinel 프로퍼티가 "존재하기만 하면"
#   Sentinel 모드로 확정한다. nodes 가 비어 있는지는 보지 않는다
#   (DataRedisConnectionConfiguration#determineMode -> getSentinelConfig() != null).
#   따라서 application.yaml 에 sentinel 블록을 두면 값이 비어 있어도
#   Sentinel 모드가 되어, Sentinel 없이는 앱이 뜨지 않는다.
#   프로파일로 분리해 두면 평소에는 프로퍼티 자체가 없어 단일 노드로 뜬다.
#
# 실행:
#   ./gradlew bootRun --args='--spring.profiles.active=sentinel'
#   java -jar matching.jar --spring.profiles.active=sentinel
#
# 실험 2 의 판 전환 (redis-ha-lab/EXPERIMENTS.md):
#   판 A (before) : 이 프로파일을 켜지 않는다                    -> 둘 다 단일 노드
#   판 B (절반)   : 프로파일 + QUEUEMATE_LOCK_SENTINEL_NODES=""  -> Redisson 만 단일
#   판 C (after)  : 프로파일만 켠다                              -> 둘 다 Sentinel
#
# 주의: Redisson 은 자동 설정을 쓰지 않으므로 RedissonConfig 가 같은 프로퍼티를
#       직접 읽어 갈래를 나눈다. 한쪽만 Sentinel 이 되면 claim 은 복구되는데
#       배정만 계속 실패하는, 겉보기로는 멀쩡한 상태가 된다 (= 판 B).
# ====================================================================
spring:
  data:
    redis:
      sentinel:
        master: ${REDIS_SENTINEL_MASTER:mymaster}
        # 비워 두면 Sentinel 모드인데 주소가 0개라 기동이 깨진다.
        # 그래서 기본값을 redis-ha-lab 의 로컬 구성으로 둔다.
        nodes: ${REDIS_SENTINEL_NODES:localhost:26379,localhost:26380,localhost:26381}
