# 개발자 로컬. docker-compose의 postgres/redis를 그대로 본다.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/queuemate}
    username: ${DB_USER:queuemate}
    password: ${DB_PASSWORD:queuemate}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

queuemate:
  oauth:
    # 카카오·네이버를 등록하기 전에도 로그인 화면을 확인할 수 있게 버튼을 내보낸다.
    # 누르면 제공자로 나가지 않고 설정이 빠졌다는 안내로 되돌린다.
    expose-unconfigured-providers: ${OAUTH_EXPOSE_UNCONFIGURED:true}
  auth:
    # local 전용 고정 secret. 운영에서 쓰이면 안 되므로 prod 프로파일에는 기본값이 없다.
    jwt-secret: ${JWT_SECRET:local-development-only-secret-key-change-me-32b}
    access-token-ttl-seconds: ${ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-token-ttl-seconds: ${REFRESH_TOKEN_TTL_SECONDS:1209600}
