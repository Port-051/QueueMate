services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: queuemate
      POSTGRES_USER: queuemate
      POSTGRES_PASSWORD: queuemate
    ports: ["5432:5432"]
    volumes:
      - qm-postgres:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queuemate"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports: ["6379:6379"]
    volumes:
      - qm-redis:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 컨테이너끼리는 compose 서비스 이름으로 붙는다. localhost는 컨테이너 자기 자신이다.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_URL: jdbc:postgresql://postgres:5432/queuemate
      DB_USER: queuemate
      DB_PASSWORD: queuemate
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # local 프로파일은 기본값을 임시 디렉터리로 두므로 컨테이너에서는 명시한다.
      # 아래 볼륨과 같은 경로여야 재시작해도 올린 사진이 남는다.
      AVATAR_DIR: /var/lib/queuemate/avatars
      # Riot 개발자 키. .env에서 온다. 비면 티어 조회만 꺼진다.
      RIOT_API_KEY: ${RIOT_API_KEY:-}
      # 아래 둘이 비어 있으면 위의 단일 인스턴스로 붙는다 (RedisConfig 참고).
      # HA로 띄울 때만 채운다: docker compose --profile ha up
      SPRING_DATA_REDIS_SENTINEL_MASTER: ${REDIS_SENTINEL_MASTER:-}
      SPRING_DATA_REDIS_SENTINEL_NODES: ${REDIS_SENTINEL_NODES:-}
      JWT_SECRET: ${JWT_SECRET:-local-development-only-secret-key-change-me-32b}
      # 소셜 로그인 자격 증명. 비어 있으면 그 제공자는 설정되지 않은 것으로 본다.
      # 값은 .env에서 온다. 저장소에 두지 않는다.
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      # 제공자 콘솔에 등록한 값과 글자 단위로 같아야 한다. 컨테이너 밖(브라우저) 주소다.
      KAKAO_SCOPE: ${KAKAO_SCOPE:-profile_nickname,account_email}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-http://localhost:8080/api/v1/auth/oauth/kakao/callback}
      NAVER_REDIRECT_URI: ${NAVER_REDIRECT_URI:-http://localhost:8080/api/v1/auth/oauth/naver/callback}
      OAUTH_FRONTEND_CALLBACK_URI: ${OAUTH_FRONTEND_CALLBACK_URI:-http://localhost:5173/auth/callback}
    ports: ["8080:8080"]
    volumes:
      - qm-avatars:/var/lib/queuemate/avatars
    healthcheck:
      # alpine 이미지에 curl이 없다. busybox wget을 쓴다.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # ---- Redis HA (docs/07 §11) ----
  # 기본 실행에는 뜨지 않는다. 띄우려면:
  #   REDIS_SENTINEL_MASTER=queuemate \
  #   REDIS_SENTINEL_NODES=redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379 \
  #   docker compose --profile ha up
  # 이때 위의 단일 redis는 떠 있어도 쓰이지 않는다.
  #
  # 한 호스트 위의 sentinel은 호스트가 죽으면 같이 죽는다. 여기 토폴로지의 목적은
  # 운영과 같은 모양으로 failover를 연습하고 검증하는 것이다. 실제 HA는 서로 다른
  # 장애 도메인에 배치해야 성립한다.

  redis-master:
    image: redis:7-alpine
    profiles: ["ha"]
    command: ["redis-server", "/usr/local/etc/redis/master.conf"]
    volumes:
      - qm-redis-master:/data
      - ./infra/redis/master.conf:/usr/local/etc/redis/master.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-replica-1: &redis-replica
    image: redis:7-alpine
    profiles: ["ha"]
    command: ["redis-server", "/usr/local/etc/redis/replica.conf"]
    volumes:
      - ./infra/redis/replica.conf:/usr/local/etc/redis/replica.conf:ro
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-replica-2:
    <<: *redis-replica

  redis-sentinel-1: &redis-sentinel
    image: redis:7-alpine
    profiles: ["ha"]
    # sentinel은 감시 결과를 자기 설정 파일에 다시 쓴다. 읽기 전용 마운트면 뜨지 않는다.
    command: ["sh", "-c", "cp /etc/redis/sentinel.conf /tmp/sentinel.conf && exec redis-sentinel /tmp/sentinel.conf"]
    volumes:
      - ./infra/redis/sentinel.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-sentinel-2:
    <<: *redis-sentinel

  redis-sentinel-3:
    <<: *redis-sentinel

  coturn:
    image: coturn/coturn:latest
    profiles: ["realtime"]
    network_mode: host
    volumes:
      - ./infra/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]

volumes:
  qm-avatars:
  qm-postgres:
  qm-redis:
  qm-redis-master:
