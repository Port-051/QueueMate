name: Release approved product landing and attach domain
on:
  push:
    branches: [feat/seo-landing]
    paths: ['.github/workflows/seo-benefits-release.yml']
permissions:
  contents: read
  statuses: write
concurrency:
  group: seo-domain-setup
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'Port-051/QueueMate' && github.ref == 'refs/heads/feat/seo-landing' && github.actor == 'shj5771' && github.triggering_actor == 'shj5771'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: af1201484256ac2feb5c6339cf29447c7ff4b5bc
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify approved product copy and interaction example
        working-directory: landing
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run build
      - name: Prepare pinned release implementation and test scope guards
        run: |
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          # The reviewed checkout still contains the complete previous implementation.
          # Pin its bytes; do not download scripts or execute the moving branch HEAD.
          source = Path('.github/workflows/seo-benefits-release.yml').read_bytes()
          blob = hashlib.sha1(f'blob {len(source)}\0'.encode() + source).hexdigest()
          assert blob == '14d6f81d9da074b124720a80768b3fe729f032f9', 'Release template changed'
          lines = source.decode().splitlines()
          start = next(i for i, line in enumerate(lines) if 'cat > "$RUNNER_TEMP/qmate-benefits-release.mjs"' in line) + 1
          end = next(i for i in range(start, len(lines)) if lines[i] == '          NODE')
          script = '\n'.join(line[10:] for line in lines[start:end]) + '\n'
          old = "source:'58910db2278096a43c251185b724c0be59679f14'"
          new = "source:'af1201484256ac2feb5c6339cf29447c7ff4b5bc'"
          assert script.count(old) == 1
          script = script.replace(old, new)
          old = "text.includes('왜 아직')&&text.includes('여러 곳을 오가던 방식')"
          new = "text.includes('조건에 맞는')&&text.includes('바로 대화하세요.')&&text.includes('class=\"join-demo\"')&&text.includes('팀원을 자동으로 찾습니다.')"
          assert script.count(old) == 1
          script = script.replace(old, new)
          script = script.replace('SEO benefits release and domain', 'SEO product release and domain')
          script = script.replace('benefits-first landing', 'approved product-first landing')
          script = script.replace('BENEFITS_UI', 'PRODUCT_UI')
          script = script.replace('Approve port-52 to update landing and add queue-mate.com + www', 'Approve port-52: approved product landing and queue-mate.com + www')
          Path(os.environ['RUNNER_TEMP'], 'qmate-benefits-release.mjs').write_text(script)
          PY
          node --check "$RUNNER_TEMP/qmate-benefits-release.mjs"
          QMATE_TEST_ONLY=1 node "$RUNNER_TEMP/qmate-benefits-release.mjs"
      - name: Install official Vercel CLI
        run: npm install --prefix "$RUNNER_TEMP/qmate-benefits-cli" --no-audit --no-fund vercel@latest
      - name: Authorize once, update only the known landing and attach its domains
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node "$RUNNER_TEMP/qmate-benefits-release.mjs"
      - name: Remove temporary authorization
        if: always()
        run: |
          AUTH_DIR="$RUNNER_TEMP/qmate-benefits-auth"
          CLI="$RUNNER_TEMP/qmate-benefits-cli/node_modules/.bin/vercel"
          if [ -f "$AUTH_DIR/auth.json" ] && [ -x "$CLI" ]; then
            timeout 20 "$CLI" logout --global-config "$AUTH_DIR" --no-color >/dev/null 2>&1 || true
          fi
          rm -rf "$AUTH_DIR"
      - name: Save nonsecret release and DNS evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: seo-product-release
          path: ${{ runner.temp }}/qmate-benefits-audit/
          if-no-files-found: ignore
          retention-days: 7
