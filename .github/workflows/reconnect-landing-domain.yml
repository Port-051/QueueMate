name: Reconnect landing domain
on:
  push:
    branches: [feat/seo-landing]
    paths: ['.github/workflows/reconnect-landing-domain.yml']
permissions:
  contents: read
concurrency:
  group: qmate-domain-reconnect
  cancel-in-progress: false
jobs:
  reconnect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Vercel CLI
        run: npm install --prefix "$RUNNER_TEMP/vercel-cli" --no-audit --no-fund vercel@62.1.0
      - name: Authorize and reconnect queue-mate.com
        run: |
          set -euo pipefail
          V="$RUNNER_TEMP/vercel-cli/node_modules/.bin/vercel"
          A="$RUNNER_TEMP/vercel-auth"
          mkdir -p "$A"
          set +e
          timeout 600 "$V" login --global-config "$A" --no-color 2>&1 | tee "$RUNNER_TEMP/vercel-login.log" &
          LOGIN_PID=$!
          set -e
          for i in $(seq 1 60); do
            URL=$(grep -Eo "https://vercel.com/oauth/device\\?user_code=[A-Z0-9-]+" "$RUNNER_TEMP/vercel-login.log" | head -1 || true)
            if [ -n "$URL" ]; then echo "VERCEL_APPROVAL_URL=$URL"; break; fi
            sleep 1
          done
          if [ -z "${URL:-}" ]; then echo "Approval URL not found"; kill "$LOGIN_PID" || true; exit 1; fi
          wait "$LOGIN_PID"
          P=$("$V" api "/v9/projects/prj_twOVEOMaFLLQtgu0n4o5l7pmggiu?teamId=team_TYonFQEoE1HOMC5bYb5xvQXV" -X GET --scope port-52 --global-config "$A" --no-color)
          node -e 'const p=JSON.parse(process.argv[1]);if(p.id!=="prj_twOVEOMaFLLQtgu0n4o5l7pmggiu"||p.name!=="queue-mate-landing")process.exit(1)' "$P"
          "$V" api "/v10/projects/prj_twOVEOMaFLLQtgu0n4o5l7pmggiu/domains?teamId=team_TYonFQEoE1HOMC5bYb5xvQXV" -X POST --input <(printf '%s' '{"name":"queue-mate.com"}') --scope port-52 --global-config "$A" --no-color
          D=$("$V" api "/v9/projects/prj_twOVEOMaFLLQtgu0n4o5l7pmggiu/domains?teamId=team_TYonFQEoE1HOMC5bYb5xvQXV&limit=100" -X GET --scope port-52 --global-config "$A" --no-color)
          node -e 'const d=JSON.parse(process.argv[1]);if(!d.domains?.some(x=>x.name==="queue-mate.com"))process.exit(1);console.log("queue-mate.com reconnected to queue-mate-landing")' "$D"
      - name: Clear authorization
        if: always()
        run: rm -rf "$RUNNER_TEMP/vercel-auth"
