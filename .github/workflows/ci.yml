# QueueMate CI
#
# docs/08_HARNESS.md §8이 "merge 전에 contract validation을 한다"고 정해 놨지만
# 그걸 돌리는 기계가 없었다. 규칙만 있고 강제가 없으면 지켜지지 않는다.
# 실제로 v1에서 계약과 구현이 12군데 어긋난 채 쌓였다. 이 파일이 그 재발을 막는다.

name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  # 같은 브랜치에 새 커밋이 오면 이전 실행은 버린다. 러너를 낭비하지 않는다.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: 계약 검증 (더미 서버)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 더미 서버는 의존성이 없다. 설치 단계가 필요 없다.
      - name: 더미 서버를 계약에 맞춰 검증한다
        run: |
          node mock-server/server.js &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/actuator/health >/dev/null && break
            sleep 1
          done
          bash mock-server/contract-smoke.sh

      - name: openapi.yaml이 유효한 YAML인지 본다
        run: |
          python3 -c "import yaml,sys; d=yaml.safe_load(open('contracts/openapi.yaml')); \
            print('paths', len(d['paths']), 'schemas', len(d['components']['schemas']))"

  backend:
    name: 백엔드 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      # ubuntu-latest 러너에는 Docker가 이미 있다. Testcontainers가 그대로 쓴다.
      - name: 계약 테스트 (HTTP 계층)
        working-directory: backend
        run: ./gradlew test --tests 'com.queuemate.api.*'

      - name: 전체 테스트 (도메인·불변식)
        working-directory: backend
        run: ./gradlew test

      - name: 실패 리포트 남기기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test

  frontend:
    name: 프론트엔드 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 의존성 설치
        working-directory: frontend
        run: npm ci
      - name: 빌드
        working-directory: frontend
        run: npm run build
