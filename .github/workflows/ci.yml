name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never interrupt an S3 upload or a production promotion midway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: 프런트 타입 검사와 빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node ../scripts/deploy/release.mjs dist "$GITHUB_SHA" app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-${{ github.sha }}
          path: frontend/dist/
          retention-days: 30

  landing:
    name: 랜딩 테스트와 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            landing/package-lock.json
            scripts/deploy/package-lock.json
      - run: npm ci --prefix landing --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix scripts/deploy --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix landing
      - run: npm test --prefix scripts/deploy
      - run: npm run build --prefix landing
        env:
          BUILD_TARGET: production
      - run: node scripts/deploy/release.mjs landing/dist "$GITHUB_SHA" landing
      - run: node scripts/deploy/vercel-output.mjs landing/dist .deploy/landing
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: landing-${{ github.sha }}
          path: .deploy/landing/.vercel/output/
          include-hidden-files: true
          retention-days: 30

  platform:
    name: 플랫폼 테스트와 빌드
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: queuemate
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d queuemate"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DB_PORT: '5433'
      REDIS_PORT: '6380'
    defaults:
      run:
        working-directory: platform/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: bash gradlew test bootJar --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: platform-test-report
          path: platform/backend/build/reports/tests/test

  service-build:
    name: ${{ matrix.service }} 빌드
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [matching, notification]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: bash gradlew bootJar --no-daemon
        working-directory: ${{ matrix.service }}/backend

  verified:
    name: 검증 완료
    if: always()
    needs: [frontend, landing, platform, service-build]
    runs-on: ubuntu-latest
    steps:
      - name: All required checks passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'if(Object.values(JSON.parse(process.env.RESULTS)).some(j => j.result !== "success")) process.exit(1)'

  deploy-app:
    name: 앱 운영 배포와 실서비스 검증
    needs: [verified]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production-app
      url: https://app.queue-mate.com
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/deploy/package-lock.json
      - name: Check deployment configuration
        env:
          ROLE: ${{ vars.AWS_ROLE_ARN }}
          REGION: ${{ vars.AWS_REGION }}
          BUCKET: ${{ vars.AWS_S3_BUCKET }}
          DISTRIBUTION: ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          test -n "$ROLE" && test -n "$REGION" && test -n "$BUCKET" && test -n "$DISTRIBUTION" || { echo 'Configure production-app using infra/deploy/bootstrap-aws.sh'; exit 1; }
      - run: npm ci --prefix scripts/deploy --ignore-scripts --no-audit --no-fund
      - run: scripts/deploy/node_modules/.bin/playwright install --with-deps chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: app-${{ github.sha }}
          path: .release/app
      - name: Prevent stale releases
        run: node scripts/deploy/current-main.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: queuemate-${{ github.run_id }}
      - name: Upload, invalidate, verify and restore on failure
        run: node scripts/deploy/deploy-app.mjs
        env:
          AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
          AWS_S3_PREFIX: ${{ vars.AWS_S3_PREFIX }}
          AWS_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: app-deployment-${{ github.sha }}
          path: .release/reports/
          retention-days: 30

  deploy-landing:
    name: 랜딩 운영 배포와 실서비스 검증
    needs: [verified]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production-landing
      url: https://queue-mate.com
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
      VERCEL_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/deploy/package-lock.json
      - name: Check deployment credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID" && test -n "$VERCEL_SCOPE" || { echo 'Configure the production-landing environment variables and VERCEL_TOKEN secret'; exit 1; }
      - run: npm ci --prefix scripts/deploy --ignore-scripts --no-audit --no-fund
      - run: scripts/deploy/node_modules/.bin/playwright install --with-deps chromium
      - run: echo "$GITHUB_WORKSPACE/scripts/deploy/node_modules/.bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: landing-${{ github.sha }}
          path: .release/landing-package/.vercel/output
      - name: Prevent stale releases
        run: node scripts/deploy/current-main.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Stage, verify, promote and restore on failure
        run: node scripts/deploy/deploy-landing.mjs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: landing-deployment-${{ github.sha }}
          path: .release/reports/
          retention-days: 30
