name: Capture pinned real UI for landing
on:
  push:
    branches: [feat/seo-landing]
    paths: ['.github/workflows/seo-ui-reference.yml', 'landing/qa/capture-reference.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: seo-ui-reference
  cancel-in-progress: true
jobs:
  reference:
    if: github.repository == 'Port-051/QueueMate' && github.ref == 'refs/heads/feat/seo-landing' && github.actor == 'shj5771'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: work
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 904cce415181aeb8a8802fc398f9be9e0835b1fe
          path: reference
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the unmodified reference frontend
        working-directory: reference/frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Install screenshot tooling
        run: |
          python3 -m pip install playwright==1.55.0 Pillow==11.3.0
          python3 -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Capture the original UI with isolated display fixtures
        run: python3 work/landing/qa/capture-reference.py --dist reference/frontend/dist --out captures
      - name: Commit only verified capture assets on the landing branch
        working-directory: work
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          mkdir -p landing/public/assets/ui
          cp ../captures/quick-match-board.webp ../captures/quick-match-settings.webp ../captures/quick-match-room.webp ../captures/capture-manifest.json landing/public/assets/ui/
          git add landing/public/assets/ui/quick-match-board.webp landing/public/assets/ui/quick-match-settings.webp landing/public/assets/ui/quick-match-room.webp landing/public/assets/ui/capture-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(frontend): 빠른매치 실제 UI 캡처 자산 추가'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/feat/seo-landing
      - name: Export captures and updated landing without credentials or fonts
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          out=pathlib.Path('export');out.mkdir(exist_ok=True)
          with zipfile.ZipFile(out/'real-ui-captures.zip','w',zipfile.ZIP_DEFLATED) as z:
              for base in [pathlib.Path('captures'),pathlib.Path('work/landing')]:
                  if not base.exists():continue
                  for p in base.rglob('*'):
                      rel=p.relative_to(base)
                      if not p.is_file() or any(x in {'node_modules','.git','.vercel'} for x in rel.parts):continue
                      if p.name.startswith('.env') or p.suffix.lower() in {'.woff','.woff2','.ttf','.otf','.eot'}:continue
                      prefix='captures' if base.name=='captures' else 'landing'
                      z.write(p,str(pathlib.Path(prefix)/rel))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-real-ui-captures
          path: export/real-ui-captures.zip
          retention-days: 3
