name: Deploy SEO landing to the new Vercel account
on:
  push:
    branches: [feat/seo-landing]
    paths: ['.github/workflows/seo-vercel-deploy.yml']
permissions:
  contents: read
  statuses: write
concurrency:
  group: seo-vercel-first-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'Port-051/QueueMate' && github.ref == 'refs/heads/feat/seo-landing' && github.actor == 'shj5771' && github.triggering_actor == 'shj5771'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TELEMETRY_DISABLED: '1'
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify latest landing before authorization
        working-directory: landing
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run build
      - name: Install official Vercel CLI
        run: npm install --prefix "$RUNNER_TEMP/qmate-vercel-cli" --no-audit --no-fund vercel@latest
      - name: Authorize new account and deploy only the landing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {spawn} from 'node:child_process';
          import {cp, mkdir, readFile, writeFile, rm} from 'node:fs/promises';
          import {stripVTControlCharacters as clean} from 'node:util';
          import {setTimeout as delay} from 'node:timers/promises';
          
          const {GITHUB_REPOSITORY: repo, GITHUB_SHA: sha, RUNNER_TEMP: temp} = process.env;
          assert.equal(repo, 'Port-051/QueueMate');
          assert.equal(process.env.GITHUB_REF, 'refs/heads/feat/seo-landing');
          assert.ok(temp?.startsWith('/'));
          const cli = `${temp}/qmate-vercel-cli/node_modules/.bin/vercel`;
          const auth = `${temp}/qmate-new-account-auth`;
          const audit = `${temp}/qmate-new-account-audit`;
          const runUrl = `https://github.com/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const projectName = 'queue-mate-landing';
          const env = Object.fromEntries(['PATH','HOME','RUNNER_TEMP','TMPDIR','NODE_EXTRA_CA_CERTS'].filter(k => process.env[k]).map(k => [k, process.env[k]]));
          Object.assign(env, {CI:'1', NO_COLOR:'1', VERCEL_TELEMETRY_DISABLED:'1'});
          const report = {sourceSha:sha, startedAt:new Date().toISOString(), projectName, verified:false, gitIntegration:false, dnsChanged:false, indexingEnabled:false};
          let team, project, previousProtection, protectionChanged = false, success = false;
          await mkdir(auth, {recursive:true, mode:0o700});
          await mkdir(audit, {recursive:true});
          
          async function status(state, description, target_url = runUrl) {
            const r = await fetch(`https://api.github.com/repos/${repo}/statuses/${sha}`, {
              method:'POST', redirect:'error', signal:AbortSignal.timeout(15000),
              headers:{Authorization:`Bearer ${process.env.GITHUB_TOKEN}`, Accept:'application/vnd.github+json', 'Content-Type':'application/json'},
              body:JSON.stringify({state, context:'SEO new account deployment', description:description.slice(0,140), target_url}),
            });
            assert.ok(r.ok, `Cannot publish deployment status (${r.status})`);
            await r.body?.cancel();
          }
          function command(executable, args, timeout = 60000, onOutput = () => {}) {
            return new Promise((resolve,reject) => {
              const child = spawn(executable,args,{env,stdio:['ignore','pipe','pipe']});
              let stdout='',stderr='',expired=false;
              const timer=setTimeout(() => {expired=true;child.kill('SIGKILL');},timeout);
              child.stdout.on('data', d => {stdout+=d;onOutput(clean(stdout+'\n'+stderr));});
              child.stderr.on('data', d => {stderr+=d;onOutput(clean(stdout+'\n'+stderr));});
              child.on('error', e => {clearTimeout(timer);reject(e);});
              child.on('close', code => {
                clearTimeout(timer);
                if(code===0&&!expired)resolve(clean(stdout));
                else reject(Error(expired?'Command timed out':`Command ${args[0]} failed (${code}); raw output withheld`));
              });
            });
          }
          const vc = (args, timeout, output) => command(cli,[...args,'--global-config',auth,'--no-color'],timeout,output);
          async function api(path, body) {
            const args=['api',path,'-X',body===undefined?'GET':'PATCH'];
            if(body!==undefined) {
              assert.equal(path, `/v9/projects/${project.id}?teamId=${team.id}`);
              assert.deepEqual(Object.keys(body),['ssoProtection']);
              const file=`${auth}/request.json`;
              await writeFile(file,JSON.stringify(body),{mode:0o600});args.push('--input',file);
            }
            return JSON.parse((await vc(args)).trim());
          }
          function chooseTeam(user, list) {
            assert.ok(Array.isArray(list.teams)&&!list.pagination?.next, 'Complete team list required');
            const chosen=list.teams.find(t => t.id===user.defaultTeamId) ?? (list.teams.length===1 ? list.teams[0] : null);
            assert.ok(chosen, 'Cannot safely choose a team in this account');
            assert.match(chosen.id,/^team_[A-Za-z0-9]+$/);
            assert.match(chosen.slug,/^[a-z0-9-]+$/);
            assert.notEqual(chosen.id,'team_o9fkGOIMeATDLtllTawvXtMy','Old account selected; approve using the newly created account');
            return chosen;
          }
          function isLanding(r, html) {
            const metas=html.match(/<meta\b[^>]*>/gi)??[];
            return r.status===200 && /text\/html/i.test(r.headers.get('content-type')??'') &&
              /<html\b[^>]*lang=["']ko["']/i.test(html) && /롤 듀오/.test(html) && /QueueMate/.test(html) &&
              metas.some(t => /name\s*=\s*["']robots["']/i.test(t) && /content\s*=\s*["'][^"']*\bnoindex\b/i.test(t));
          }
          async function findPublic(candidates) {
            for(const url of candidates) {
              const r=await fetch(url,{redirect:'manual',signal:AbortSignal.timeout(15000)});
              if(isLanding(r,await r.text()))return url;
            }
            return null;
          }
          // Guard regressions run before any account login or resource creation.
          const example={id:'team_new',slug:'new-account'};
          assert.equal(chooseTeam({}, {teams:[example]}).id, example.id);
          assert.throws(() => chooseTeam({}, {teams:[]}));
          assert.throws(() => chooseTeam({}, {teams:[example,{id:'team_other',slug:'other'}]}));
          assert.throws(() => chooseTeam({}, {teams:[{...example,id:'team_o9fkGOIMeATDLtllTawvXtMy'}]}));
          assert.throws(() => chooseTeam({}, {teams:[example],pagination:{next:1}}));
          const html='<html lang="ko"><meta name="robots" content="noindex, nofollow"><title>롤 듀오 QueueMate</title>';
          assert.equal(isLanding({status:200,headers:new Headers({'content-type':'text/html'})},html),true);
          assert.equal(isLanding({status:302,headers:new Headers({'content-type':'text/html'})},html),false);
          assert.equal(isLanding({status:200,headers:new Headers({'content-type':'text/html'})},'<title>Login to Vercel</title>'),false);
          
          try {
            const config=JSON.parse(await readFile('landing/site.config.json','utf8'));
            assert.equal(config.origin,'https://queue-mate.com');
            assert.equal(config.allowIndexing,false);
            assert.equal(config.appReady,false);
            await status('pending','Preparing login for the NEW Vercel account');
            let published=false, notice=Promise.resolve();
            await vc(['login'],600000,output => {
              const match=output.match(/https:\/\/vercel\.com\/oauth\/device\?user_code=[A-Z0-9-]+/);
              if(published||!match)return;
              published=true;
              notice=status('pending','Approve with the NEW Vercel account to deploy QueueMate',match[0]);
              notice.catch(() => {});
            });
            await notice;
            const {user}=await api('/v2/user');
            team=chooseTeam(user,await api('/v2/teams?limit=100'));
            report.teamId=team.id;report.teamSlug=team.slug;
            await status('pending','Authorized; creating queue-mate-landing in the selected new account');
            // Explicit creation fails on an existing name; do not adopt or overwrite a project.
            const createdAfter=Date.now()-60000;
            await vc(['project','add',projectName,'--scope',team.slug]);
            project=await api(`/v9/projects/${projectName}?teamId=${team.id}`);
            assert.match(project.id,/^prj_[A-Za-z0-9]+$/);
            assert.equal(project.name,projectName);assert.equal(project.accountId,team.id);
            assert.ok(project.createdAt>=createdAfter,'Refusing to use an existing project');
            report.projectId=project.id;
            const directory=`${temp}/${projectName}`;
            await mkdir(`${directory}/.vercel`,{recursive:true});
            await mkdir(`${directory}/scripts`,{recursive:true});
            for(const file of ['package.json','package-lock.json','site.config.json','vercel.json','src','public']) {
              await cp(`landing/${file}`,`${directory}/${file}`,{recursive:true});
            }
            await cp('landing/scripts/build.mjs',`${directory}/scripts/build.mjs`);
            await writeFile(`${directory}/.vercel/project.json`,JSON.stringify({projectId:project.id,orgId:team.id,projectName}));
            // Production here is the NEW isolated demo, not the matching app or custom domain.
            const result=await vc(['deploy','--cwd',directory,'--yes','--prod','--scope',team.slug,'--meta',`githubCommitSha=${sha}`],300000);
            const hosts=result.match(/https:\/\/[a-z0-9.-]+\.vercel\.app/gi);
            assert.ok(hosts?.length,'CLI did not return a deployment URL');
            const deployment=await api(`/v13/deployments/${new URL(hosts.at(-1)).hostname}?teamId=${team.id}`);
            assert.equal(deployment.projectId,project.id);assert.equal(deployment.readyState,'READY');
            assert.equal(deployment.meta?.githubCommitSha,sha);
            report.deploymentId=deployment.id;report.deploymentUrl=`https://${deployment.url}/`;
            const candidates=[...new Set([...(deployment.alias??[]),deployment.url])].filter(h => typeof h==='string' && /^[a-z0-9-]+\.vercel\.app$/i.test(h)).map(h => `https://${h}/`);
            let publicUrl=await findPublic(candidates);
            if(!publicUrl) {
              const current=await api(`/v9/projects/${project.id}?teamId=${team.id}`);
              const list=await api(`/v7/deployments?projectId=${project.id}&limit=2&teamId=${team.id}`);
              const domains=await api(`/v9/projects/${project.id}/domains?teamId=${team.id}`);
              assert.equal(current.accountId,team.id);assert.equal(current.name,projectName);
              assert.equal(list.deployments?.length,1);assert.equal(list.deployments[0].uid,deployment.id);
              assert.ok(!list.pagination?.next&&!domains.pagination?.next);
              assert.ok(domains.domains?.every(d => /^[a-z0-9-]+\.vercel\.app$/i.test(d.name)));
              assert.ok(!current.passwordProtection&&!current.trustedIps);
              previousProtection=current.ssoProtection??null;
              if(previousProtection) {
                protectionChanged=true;
                await api(`/v9/projects/${project.id}?teamId=${team.id}`,{ssoProtection:null});
              }
              for(let i=0;i<6&&!publicUrl;i++){await delay(2000);publicUrl=await findPublic(candidates);}
            }
            assert.ok(publicUrl,'Deployment exists but anonymous landing is not available');
            report.publicUrl=publicUrl;
            const checks=await command(process.execPath,['landing/scripts/check-url.mjs',publicUrl,'preview',`${audit}/http-checks.json`],150000);
            await writeFile(`${audit}/http-checks.txt`,checks);
            report.verified=true;success=true;
            await status('success','PUBLIC_LANDING_VERIFIED; new account; domain and indexing unchanged',publicUrl);
            console.log(`Verified landing: ${publicUrl}`);
          } catch(error) {
            report.error=error.message;
            if(protectionChanged&&!success) {
              try {await api(`/v9/projects/${project.id}?teamId=${team.id}`,{ssoProtection:previousProtection});report.protectionRestored=true;}
              catch {report.protectionRestored=false;}
            }
            await status('failure',report.error).catch(() => {});
            console.error(report.error);process.exitCode=1;
          } finally {
            await vc(['logout'],20000).catch(() => {});
            await rm(auth,{recursive:true,force:true});
            report.finishedAt=new Date().toISOString();
            await writeFile(`${audit}/report.json`,JSON.stringify(report,null,2)+'\n');
            await writeFile(process.env.GITHUB_STEP_SUMMARY,`## QueueMate new account deployment\n\nVerified: ${report.verified}\nProject: ${report.projectName}\nTeam: ${report.teamSlug??'not authorized'}\nURL: ${report.publicUrl??report.deploymentUrl??'not created'}\nSource: ${sha}\n\nNo old projects, Gabia DNS, search indexing, main branch, or Git integration settings were changed.\n`);
          }
          NODE
      - name: Remove temporary authorization
        if: always()
        run: |
          AUTH_DIR="$RUNNER_TEMP/qmate-new-account-auth"
          CLI="$RUNNER_TEMP/qmate-vercel-cli/node_modules/.bin/vercel"
          if [ -f "$AUTH_DIR/auth.json" ] && [ -x "$CLI" ]; then
            timeout 20 "$CLI" logout --global-config "$AUTH_DIR" --no-color >/dev/null 2>&1 || true
          fi
          rm -rf "$AUTH_DIR"
      - name: Save deployment evidence without credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-new-account-deployment
          path: ${{ runner.temp }}/qmate-new-account-audit/
          if-no-files-found: ignore
          retention-days: 7
