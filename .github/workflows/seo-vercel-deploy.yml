name: Deploy SEO landing to Vercel once
on:
  push:
    branches: [feat/seo-landing]
    paths: ['.github/workflows/seo-vercel-deploy.yml']
permissions:
  contents: read
  statuses: write
concurrency:
  group: seo-vercel-first-deployment
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TELEMETRY_DISABLED: '1'
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify landing before requesting authorization
        working-directory: landing
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run build
      - name: Install official Vercel CLI
        run: npm install --prefix "$RUNNER_TEMP/qmate-vercel-cli" --no-audit --no-fund vercel@latest
      - name: Request user authorization and deploy isolated preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import {spawn} from 'node:child_process';
          import {cp, mkdir, readFile, writeFile} from 'node:fs/promises';
          import {stripVTControlCharacters} from 'node:util';
          const cli = `${process.env.RUNNER_TEMP}/qmate-vercel-cli/node_modules/.bin/vercel`;
          const auth = `${process.env.RUNNER_TEMP}/qmate-vercel-auth`;
          const {GITHUB_TOKEN, ...childEnv} = process.env;
          const repository = process.env.GITHUB_REPOSITORY;
          const sha = process.env.GITHUB_SHA;
          const runUrl = `https://github.com/${repository}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const context = 'Vercel SEO preview';
          async function status(state, description, target_url = runUrl) {
            const response = await fetch(`https://api.github.com/repos/${repository}/statuses/${sha}`, {
              method: 'POST', signal: AbortSignal.timeout(15000),
              headers: {Authorization: `Bearer ${GITHUB_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json'},
              body: JSON.stringify({state, context, description, target_url})
            });
            if (!response.ok) throw Error(`Could not record deployment status (${response.status})`);
          }
          function execute(args, onOutput = () => {}, timeoutMs = 600000) {
            return new Promise((resolve, reject) => {
              const child = spawn(cli, [...args, '--global-config', auth, '--no-color'], {env: childEnv, stdio: ['ignore', 'pipe', 'pipe']});
              let stdout = '', stderr = '', settled = false;
              const timer = setTimeout(() => {child.kill('SIGTERM'); finish(Error('Vercel command timed out'));}, timeoutMs);
              function finish(error) {if(settled)return;settled=true;clearTimeout(timer);error?reject(error):resolve({stdout,stderr});}
              child.stdout.on('data', data => {stdout += data; onOutput(stdout + '\n' + stderr);});
              child.stderr.on('data', data => {stderr += data; onOutput(stdout + '\n' + stderr);});
              child.on('error', finish);
              child.on('close', code => finish(code === 0 ? null : Error(`Vercel ${args[0]} exited with code ${code}`)));
            });
          }
          try {
            const config = JSON.parse(await readFile('landing/site.config.json', 'utf8'));
            if(config.allowIndexing || config.appReady) throw Error('First deployment must stay noindex and keep the app disconnected');
            await mkdir(auth, {recursive: true, mode: 0o700});
            await status('pending', 'Preparing official Vercel device authorization');
            let approvalPublished = false, approvalTask = Promise.resolve();
            console.log('Requesting Vercel login. Only the user-facing verification URL is published, never access or refresh tokens.');
            await execute(['login'], output => {
              if(approvalPublished)return;
              const clean = stripVTControlCharacters(output);
              const match = clean.match(/https:\/\/vercel\.com\/[^\s<>"']*user_code=[A-Za-z0-9-]+/);
              if(!match)return;
              const url = new URL(match[0]);
              if(url.protocol !== 'https:' || url.hostname !== 'vercel.com')return;
              approvalPublished = true;
              approvalTask = status('pending', 'Approve this Vercel login to deploy the QueueMate preview', url.href);
              approvalTask.catch(() => {});
              console.log('Approval link attached to the Vercel SEO preview commit status.');
            });
            await approvalTask;
            await status('pending', 'Authorized; deploying to a new isolated Vercel project');
            const project = `q-mate-landing-${process.env.GITHUB_RUN_ID}`;
            const directory = `${process.env.RUNNER_TEMP}/${project}`;
            await mkdir(directory, {recursive: true});
            for(const path of ['package.json','package-lock.json','site.config.json','vercel.json','src','scripts','public']) {
              await cp(`landing/${path}`, `${directory}/${path}`, {recursive: true});
            }
            const result = await execute(['deploy', '--cwd', directory, '--yes', '--target', 'preview', '--meta', `githubCommitSha=${sha}`]);
            const urls = stripVTControlCharacters(result.stdout).match(/https:\/\/[a-z0-9.-]+\.vercel\.app/gi);
            if(!urls?.length)throw Error('Deployment completed without a verifiable Vercel URL');
            const url = urls.at(-1);
            await status('success', 'QueueMate preview deployed; custom domain and indexing remain off', url);
            await writeFile(`${process.env.RUNNER_TEMP}/qmate-deployment-url.txt`, url + '\n');
            await writeFile(process.env.GITHUB_STEP_SUMMARY, `Preview: ${url}\nSource: ${sha}\nProject: ${project}\nCustom domain, indexing and app connection were not enabled.\n`);
            const response = await fetch(url, {signal: AbortSignal.timeout(15000)});
            console.log(`Deployment URL: ${url}`);
            console.log(`Unauthenticated HTTP status: ${response.status}; 401/403 can indicate Vercel deployment protection.`);
            if(response.status === 200){
              const html = await response.text();
              if(!html.includes('content="noindex, nofollow"') || !html.includes('롤 듀오'))throw Error('Deployed homepage failed the preview smoke check');
              console.log('Live homepage and noindex verified.');
            }
          } catch(error) {
            await status('failure', String(error.message).slice(0, 140)).catch(() => {});
            console.error(error.message);
            process.exitCode = 1;
          }
          NODE
      - name: Revoke temporary CLI login and remove local credentials
        if: always()
        run: |
          AUTH_DIR="$RUNNER_TEMP/qmate-vercel-auth"
          CLI="$RUNNER_TEMP/qmate-vercel-cli/node_modules/.bin/vercel"
          if [ -x "$CLI" ]; then timeout 20 "$CLI" logout --global-config "$AUTH_DIR" --no-color >/dev/null 2>&1 || true; fi
          rm -rf "$AUTH_DIR"
