openapi: 3.0.3
info:
  title: QueueMate API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /auth/signup:
    post:
      summary: Sign up
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '409': { description: Email or nickname already in use }
  /auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { description: Invalid credentials }
  /auth/refresh:
    post:
      summary: Rotate refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Rotated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { description: Invalid or reused refresh token }
  /auth/logout:
    post:
      summary: Logout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204': { description: Logged out }
  /users/me:
    get:
      summary: Current user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
    patch:
      summary: Update current user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '409': { description: Nickname already taken }
  /users/me/game-accounts:
    get:
      summary: My linked game accounts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GameAccountView' }
    post:
      summary: Link a game account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGameAccountRequest' }
      responses:
        '201':
          description: Linked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameAccountView' }
        '409': { description: Already linked }
  /users/me/game-accounts/{id}:
    delete:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      summary: Unlink a game account
      responses:
        '204': { description: Unlinked }
        '404': { description: Not found }
  /games:
    get:
      summary: Supported games
      responses:
        '200':
          description: OK
  /match-requests:
    post:
      summary: Start realtime matching
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMatchRequest' }
      responses:
        '201':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchRequestView' }
        '409': { description: User already has active request }
  /match-requests/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Match request status
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchRequestView' }
    delete:
      summary: Cancel realtime matching
      responses:
        '204': { description: Cancelled }
  /proposals/{id}/accept:
    post:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      summary: Accept proposal
      responses:
        '200':
          description: Acceptance updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProposalView' }
  /proposals/{id}/decline:
    post:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      summary: Decline proposal
      responses:
        '200': { description: Declined }
  /reservations:
    post:
      summary: Create reservation matching request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReservationRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationView' }
        '409': { description: Overlapping active reservation }
    get:
      summary: List my reservations
      responses:
        '200': { description: OK }
  /reservations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Reservation detail
      responses:
        '200': { description: OK }
    patch:
      summary: Edit active reservation
      responses:
        '200': { description: Updated }
    delete:
      summary: Cancel reservation
      responses:
        '204': { description: Cancelled }
  /parties/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      summary: Party detail
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartyView' }
  /parties/{id}/ready:
    post:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      summary: Set ready state
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [ready]
              properties:
                ready: { type: boolean }
      responses:
        '200': { description: Updated }
  /parties/{id}/leave:
    post:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      summary: Leave party
      description: >
        명시적 이탈은 유예 없이 즉시 처리한다. 연결 끊김은 재접속 유예를 거치지만
        본인이 나가겠다고 한 경우는 기다릴 이유가 없다.
        나간 사용자는 홈으로 돌아가며 매칭 요청이 자동으로 만들어지지 않는다.
        남은 인원이 1명이 되면 파티는 CLOSED가 되고, 남은 사용자는 대기열로 복귀한다.
      responses:
        '204': { description: Left }
        '404': { description: 파티가 없거나 멤버가 아니다 }
        '409': { description: 이미 나갔거나 종료된 파티다 }
  /friends:
    get:
      summary: Friend list
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FriendView' }
  /friends/{userId}:
    delete:
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      summary: Remove a friend
      responses:
        '204': { description: Removed }
        '404': { description: Not a friend }
  /friend-requests:
    get:
      summary: My friend requests
      parameters:
        - name: direction
          in: query
          required: false
          schema: { type: string, enum: [RECEIVED, SENT], default: RECEIVED }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FriendRequestView' }
    post:
      summary: Send friend request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFriendRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FriendRequestView' }
        '409': { description: Already friends, request pending, or blocked }
  /friend-requests/{id}/accept:
    post:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      summary: Accept a received friend request
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FriendView' }
        '409': { description: Request is not pending }
  /friend-requests/{id}/decline:
    post:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      summary: Decline a received friend request
      responses:
        '204': { description: Declined }
        '409': { description: Request is not pending }
  /friend-requests/{id}:
    delete:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      summary: Cancel a sent friend request
      responses:
        '204': { description: Cancelled }
        '409': { description: Request is not pending }
  /blocks:
    get:
      summary: Block list
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BlockView' }
    post:
      summary: Block user
      description: |
        차단하면 기존 친구 관계와 대기 중인 친구 요청이 함께 제거되고,
        이후 매칭 후보에서 양방향으로 즉시 제외된다 (docs/01 Block flow, INV-6).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBlockRequest' }
      responses:
        '201':
          description: Blocked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlockView' }
        '409': { description: Already blocked or self }
  /blocks/{userId}:
    delete:
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      summary: Unblock user
      responses:
        '204': { description: Unblocked }
        '404': { description: Not blocked }
  /recent-players:
    get:
      summary: Recent party members
      description: 완료된 party history에서 조회한다. 차단한 사용자는 제외된다.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RecentPlayerView' }
  /reports:
    post:
      summary: Report a user
      description: |
        서버가 음성/채팅을 저장하지 않으므로 category와 선택 설명, 식별자만 받는다
        (docs/13 Reporting).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReportRequest' }
      responses:
        '201': { description: Created }
components:
  schemas:
    SignupRequest:
      type: object
      required: [email, password, nickname]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        nickname: { type: string, minLength: 2, maxLength: 16 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    TokenResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, description: access token TTL in seconds }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    UserProfile:
      type: object
      required: [id, nickname]
      properties:
        id: { type: string, format: uuid }
        nickname: { type: string }
        avatarUrl: { type: string, nullable: true }
    UpdateUserRequest:
      type: object
      properties:
        nickname: { type: string, minLength: 2, maxLength: 16 }
        avatarUrl: { type: string, nullable: true }
    GameAccountView:
      type: object
      required: [id, game, externalGameId]
      properties:
        id: { type: string, format: uuid }
        game: { $ref: '#/components/schemas/GameKey' }
        externalGameId: { type: string }
        region: { type: string, nullable: true }
        rankCode: { type: string, nullable: true }
        verifiedAt: { type: string, format: date-time, nullable: true }
    CreateGameAccountRequest:
      type: object
      required: [game, externalGameId]
      properties:
        game: { $ref: '#/components/schemas/GameKey' }
        externalGameId: { type: string, maxLength: 128 }
        region: { type: string, maxLength: 20, nullable: true }
    GameKey:
      type: string
      enum: [LOL, VALORANT, PUBG]
    FriendView:
      type: object
      required: [userId, nickname]
      properties:
        userId: { type: string, format: uuid }
        nickname: { type: string }
        avatarUrl: { type: string, nullable: true }
        friendedAt: { type: string, format: date-time }
    FriendRequestView:
      type: object
      required: [id, direction, counterpartUserId, status]
      properties:
        id: { type: string, format: uuid }
        direction: { type: string, enum: [RECEIVED, SENT] }
        counterpartUserId: { type: string, format: uuid }
        counterpartNickname: { type: string }
        status: { type: string, enum: [PENDING, ACCEPTED, DECLINED, CANCELLED] }
        createdAt: { type: string, format: date-time }
    CreateFriendRequest:
      type: object
      required: [targetUserId]
      properties:
        targetUserId: { type: string, format: uuid }
    BlockView:
      type: object
      required: [userId]
      properties:
        userId: { type: string, format: uuid }
        nickname: { type: string }
        blockedAt: { type: string, format: date-time }
    CreateBlockRequest:
      type: object
      required: [targetUserId]
      properties:
        targetUserId: { type: string, format: uuid }
    RecentPlayerView:
      type: object
      required: [userId, nickname, lastPlayedAt]
      properties:
        userId: { type: string, format: uuid }
        nickname: { type: string }
        avatarUrl: { type: string, nullable: true }
        lastPlayedAt: { type: string, format: date-time }
        playCount: { type: integer }
        friend: { type: boolean }
    ReportReason:
      type: string
      enum: [ABUSIVE_LANGUAGE, HARASSMENT, CHEATING, TROLLING_OR_AFK, INAPPROPRIATE_PROFILE, OTHER]
    CreateReportRequest:
      type: object
      required: [targetUserId, reason]
      properties:
        targetUserId: { type: string, format: uuid }
        reason: { $ref: '#/components/schemas/ReportReason' }
        description: { type: string, maxLength: 1000, nullable: true }
        partyId: { type: string, format: uuid, nullable: true }
    VoicePreference:
      type: string
      enum: [REQUIRED, OPTIONAL, NO_VOICE]
    PlayPurpose:
      type: string
      enum: [RANK_UP, NORMAL, FUN]
    KeyCondition:
      type: object
      required: [type, value]
      properties:
        type:
          type: string
          enum: [POSITION, ROLE, PLAY_STYLE]
        value: { type: string }
    MatchCondition:
      type: object
      required: [game, modeKey, keyCondition, voicePreference, playPurpose]
      properties:
        game: { $ref: '#/components/schemas/GameKey' }
        modeKey: { type: string }
        keyCondition: { $ref: '#/components/schemas/KeyCondition' }
        voicePreference: { $ref: '#/components/schemas/VoicePreference' }
        playPurpose: { $ref: '#/components/schemas/PlayPurpose' }
    CreateMatchRequest:
      allOf:
        - $ref: '#/components/schemas/MatchCondition'
    MatchRequestView:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [QUEUED, PROPOSED, MATCHED, CANCELLED, EXPIRED] }
        queuedAt: { type: string, format: date-time }
        proposalId: { type: string, format: uuid, nullable: true }
    PlayAmount:
      type: string
      enum: [ONE_GAME, TWO_PLUS]
    CreateReservationRequest:
      type: object
      required: [condition, availableFrom, availableTo, playAmount]
      properties:
        condition: { $ref: '#/components/schemas/MatchCondition' }
        availableFrom: { type: string, format: date-time }
        availableTo: { type: string, format: date-time }
        playAmount: { $ref: '#/components/schemas/PlayAmount' }
    ReservationView:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, PROPOSED, MATCHED, CANCELLED, EXPIRED, COMPLETED] }
        scheduledStart: { type: string, format: date-time, nullable: true }
    ProposalMember:
      type: object
      properties:
        userId: { type: string, format: uuid }
        nickname: { type: string }
        acceptance: { type: string, enum: [PENDING, ACCEPTED, DECLINED] }
    ProposalView:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, CONFIRMED, DECLINED, EXPIRED, CANCELLED] }
        expiresAt: { type: string, format: date-time }
        members:
          type: array
          items: { $ref: '#/components/schemas/ProposalMember' }
        partyId: { type: string, format: uuid, nullable: true }
    PartyView:
      type: object
      properties:
        id: { type: string, format: uuid }
        game: { $ref: '#/components/schemas/GameKey' }
        modeKey: { type: string }
        targetSize: { type: integer }
        status: { type: string, enum: [OPEN, READY, PLAYING, CLOSED] }
        members:
          type: array
          items:
            type: object
            properties:
              userId: { type: string, format: uuid }
              nickname: { type: string }
              ready: { type: boolean }
