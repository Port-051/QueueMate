openapi: 3.0.3
info:
  title: QueueMate API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /auth/signup:
    post:
      summary: Sign up
      description: >
        같은 IP에서의 가입 속도를 제한한다. 비밀번호 해싱이 의도적으로 비싼 연산이라
        짧은 시간에 몰리면 인증 서버의 CPU를 소모하고, 계정이 양산되면 대기열에
        가짜 참가자가 그만큼 늘어난다. 짧은 창과 하루 창을 함께 센다.
        이미 가입된 계정을 가진 사용자를 막는 장치가 아니므로 차단 회피는 이것으로
        막히지 않는다. 그건 신원 확인의 영역이다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '409': { description: Email or nickname already in use }
        '429': { description: 가입 속도 제한에 걸렸다 }
  /auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { description: Invalid credentials }
        '429': { description: 로그인 시도가 너무 잦다. 이메일별과 IP별을 함께 센다 }
  /auth/refresh:
    post:
      summary: Rotate refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Rotated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { description: Invalid or reused refresh token }
  /auth/logout:
    post:
      summary: Logout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204': { description: Logged out }
  /users/me:
    get:
      summary: Current user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
    patch:
      summary: Update current user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '409': { description: Nickname already taken }
  /users/me/game-accounts:
    get:
      summary: My linked game accounts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GameAccountView' }
    post:
      summary: Link a game account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGameAccountRequest' }
      responses:
        '201':
          description: Linked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameAccountView' }
        '409': { description: Already linked }
  /users/me/game-accounts/{id}:
    delete:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      summary: Unlink a game account
      responses:
        '204': { description: Unlinked }
        '404': { description: Not found }
  /games:
    get:
      summary: Supported games
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GameView' }
  /games/{gameKey}/modes:
    get:
      parameters:
        - name: gameKey
          in: path
          required: true
          schema: { $ref: '#/components/schemas/GameKey' }
      summary: Active modes of a game
      description: |
        targetPartySize는 서버가 정한다. 클라이언트는 파티 정원을 보내지 않는다
        (docs/03 §9).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GameModeView' }
  /games/{gameKey}/match-schema:
    get:
      parameters:
        - name: gameKey
          in: path
          required: true
          schema: { $ref: '#/components/schemas/GameKey' }
      summary: Match form schema of a game
      description: 게임별 조건 폼의 선택지 전체. 프론트가 폼을 그리는 근거다.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchSchemaView' }
        '404': { description: Unknown or inactive game }
  /match-requests:
    post:
      summary: Start realtime matching
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMatchRequest' }
      responses:
        '201':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchRequestView' }
        '404':
          description: Unknown or inactive game mode
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: User already has active request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: Matching store unavailable. 새 매칭은 fail-closed 한다 (INV-10)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /match-requests/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Match request status
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchRequestView' }
    delete:
      summary: Cancel realtime matching
      responses:
        '204': { description: Cancelled }
  /proposals/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      summary: Proposal detail
      description: 참가자만 조회할 수 있다. 참가자가 아니면 404다.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProposalView' }
        '404': { description: Not found or not a participant }
  /proposals/{id}/accept:
    post:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      summary: Accept proposal
      description: |
        전원이 수락하면 그 자리에서 CONFIRMED가 된다 (INV-4).
        만료·거절·확정된 제안은 다시 수락할 수 없다 (INV-5).
      responses:
        '200':
          description: Acceptance updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProposalView' }
        '404': { description: Not found or not a participant }
        '409':
          description: Proposal already expired or finished
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /proposals/{id}/decline:
    post:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      summary: Decline proposal
      description: 한 명이 거절하면 제안 전체가 끝나고 나머지는 대기 상태로 돌아간다.
      responses:
        '204': { description: Declined }
        '404': { description: Not found or not a participant }
        '409':
          description: Proposal already finished
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /reservations:
    post:
      summary: Create reservation matching request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReservationRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationView' }
        '409':
          description: Overlapping active reservation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      summary: List my reservations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReservationView' }
  /reservations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Reservation detail
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationView' }
    patch:
      summary: Edit active reservation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReservationRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationView' }
        '409':
          description: Overlapping active reservation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      summary: Cancel reservation
      responses:
        '204': { description: Cancelled }
  /parties/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      summary: Party detail
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartyView' }
  /parties/{id}/leave:
    post:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      summary: Leave party
      responses:
        '204': { description: Left }
  /parties/{id}/invite/{friendUserId}:
    post:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: friendUserId
          in: path
          required: true
          schema: { type: string, format: uuid }
      summary: Invite a friend to the party
      responses:
        '202': { description: Invite sent }
        '409': { description: Party is full, blocked, or already a member }
  /parties/{id}/ready:
    post:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      summary: Set ready state
      description: >
        전원이 준비를 마치면 파티는 READY가 되고, 그 상태가 일정 시간 유지되면
        PLAYING으로 넘어간다. 서버는 게임을 관측할 수 없으므로 시작 신호 대신
        시간으로 판정한다. PLAYING 이후에는 준비 상태를 바꿀 수 없고, 되돌리려면
        파티를 나가야 한다.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [ready]
              properties:
                ready: { type: boolean }
      responses:
        '200': { description: Updated }
        '404': { description: 파티가 없거나 멤버가 아니다 }
        '409': { description: 종료된 파티이거나 이미 게임이 시작됐다 }
  /parties/{id}/leave:
    post:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      summary: Leave party
      description: >
        명시적 이탈은 유예 없이 즉시 처리한다. 연결 끊김은 재접속 유예를 거치지만
        본인이 나가겠다고 한 경우는 기다릴 이유가 없다.
        나간 사용자는 홈으로 돌아가며 매칭 요청이 자동으로 만들어지지 않는다.
        남은 인원이 1명이 되면 파티는 CLOSED가 되고, 남은 사용자는 대기열로 복귀한다.
      responses:
        '204': { description: Left }
        '404': { description: 파티가 없거나 멤버가 아니다 }
        '409': { description: 이미 나갔거나 종료된 파티다 }
  /friends:
    get:
      summary: Friend list
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FriendView' }
  /friends/{userId}:
    delete:
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      summary: Remove a friend
      responses:
        '204': { description: Removed }
        '404': { description: Not a friend }
  /friend-requests:
    get:
      summary: My friend requests
      parameters:
        - name: direction
          in: query
          required: false
          schema: { type: string, enum: [RECEIVED, SENT], default: RECEIVED }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FriendRequestView' }
    post:
      summary: Send friend request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFriendRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FriendRequestView' }
        '409': { description: Already friends, request pending, or blocked }
  /friend-requests/{id}/accept:
    post:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      summary: Accept a received friend request
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FriendView' }
        '409': { description: Request is not pending }
  /friend-requests/{id}/decline:
    post:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      summary: Decline a received friend request
      responses:
        '204': { description: Declined }
        '409': { description: Request is not pending }
  /friend-requests/{id}:
    delete:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      summary: Cancel a sent friend request
      responses:
        '204': { description: Cancelled }
        '409': { description: Request is not pending }
  /blocks:
    get:
      summary: Block list
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BlockView' }
    post:
      summary: Block user
      description: |
        차단하면 기존 친구 관계와 대기 중인 친구 요청이 함께 제거되고,
        이후 매칭 후보에서 양방향으로 즉시 제외된다 (docs/01 Block flow, INV-6).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBlockRequest' }
      responses:
        '201':
          description: Blocked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlockView' }
        '409': { description: Already blocked or self }
  /blocks/{userId}:
    delete:
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      summary: Unblock user
      responses:
        '204': { description: Unblocked }
        '404': { description: Not blocked }
  /recent-players:
    get:
      summary: Recent party members
      description: 완료된 party history에서 조회한다. 차단한 사용자는 제외된다.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RecentPlayerView' }
  /reports:
    post:
      summary: Report a user
      description: |
        서버가 음성/채팅을 저장하지 않으므로 category와 선택 설명, 식별자만 받는다
        (docs/13 Reporting).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReportRequest' }
      responses:
        '201': { description: Created }
components:
  schemas:
    SignupRequest:
      type: object
      required: [email, password, nickname]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        nickname: { type: string, minLength: 2, maxLength: 16 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    TokenResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, description: access token TTL in seconds }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    UserProfile:
      type: object
      required: [id, nickname]
      properties:
        id: { type: string, format: uuid }
        nickname: { type: string }
        avatarUrl: { type: string, nullable: true }
    UpdateUserRequest:
      type: object
      properties:
        nickname: { type: string, minLength: 2, maxLength: 16 }
        avatarUrl: { type: string, nullable: true }
    GameAccountView:
      type: object
      required: [id, game, externalGameId]
      properties:
        id: { type: string, format: uuid }
        game: { $ref: '#/components/schemas/GameKey' }
        externalGameId: { type: string }
        region: { type: string, nullable: true }
        rankCode: { type: string, nullable: true }
        verifiedAt: { type: string, format: date-time, nullable: true }
    CreateGameAccountRequest:
      type: object
      required: [game, externalGameId]
      properties:
        game: { $ref: '#/components/schemas/GameKey' }
        externalGameId: { type: string, maxLength: 128 }
        region: { type: string, maxLength: 20, nullable: true }
    GameKey:
      type: string
      enum: [LOL, VALORANT, PUBG]
    ErrorResponse:
      type: object
      required: [code, message]
      description: |
        모든 4xx/5xx 응답의 공통 형태다. code는 클라이언트가 분기해도 되는 안정된 값이고,
        message는 사람이 읽는 설명이라 바뀔 수 있다.
      properties:
        code:
          type: string
          example: ACTIVE_MATCH_REQUEST_EXISTS
        message: { type: string }
    GameView:
      type: object
      required: [game, keyConditionType]
      properties:
        game: { $ref: '#/components/schemas/GameKey' }
        keyConditionType:
          type: string
          enum: [POSITION, ROLE, PLAY_STYLE]
    GameModeView:
      type: object
      required: [modeKey, targetPartySize, roleUniqueness]
      properties:
        modeKey: { type: string, example: SOLO_DUO_RANKED }
        targetPartySize:
          type: integer
          minimum: 2
          description: 확정 파티 인원. 서버가 정한다
        roleUniqueness:
          type: boolean
          description: true면 파티 안에서 keyCondition 값이 겹칠 수 없다
    MatchSchemaView:
      type: object
      required: [game, modes, keyCondition, voicePreferences, playPurposes]
      properties:
        game: { $ref: '#/components/schemas/GameKey' }
        modes:
          type: array
          items: { $ref: '#/components/schemas/GameModeView' }
        keyCondition:
          type: object
          required: [type, values]
          properties:
            type:
              type: string
              enum: [POSITION, ROLE, PLAY_STYLE]
            values:
              type: array
              items: { type: string }
        voicePreferences:
          type: array
          items: { $ref: '#/components/schemas/VoicePreference' }
        playPurposes:
          type: array
          items: { $ref: '#/components/schemas/PlayPurpose' }
    FriendView:
      type: object
      required: [userId, nickname]
      properties:
        userId: { type: string, format: uuid }
        nickname: { type: string }
        avatarUrl: { type: string, nullable: true }
        friendedAt: { type: string, format: date-time }
    FriendRequestView:
      type: object
      required: [id, direction, counterpartUserId, status]
      properties:
        id: { type: string, format: uuid }
        direction: { type: string, enum: [RECEIVED, SENT] }
        counterpartUserId: { type: string, format: uuid }
        counterpartNickname: { type: string }
        status: { type: string, enum: [PENDING, ACCEPTED, DECLINED, CANCELLED] }
        createdAt: { type: string, format: date-time }
    CreateFriendRequest:
      type: object
      required: [targetUserId]
      properties:
        targetUserId: { type: string, format: uuid }
    BlockView:
      type: object
      required: [userId]
      properties:
        userId: { type: string, format: uuid }
        nickname: { type: string }
        blockedAt: { type: string, format: date-time }
    CreateBlockRequest:
      type: object
      required: [targetUserId]
      properties:
        targetUserId: { type: string, format: uuid }
    RecentPlayerView:
      type: object
      required: [userId, nickname, lastPlayedAt]
      properties:
        userId: { type: string, format: uuid }
        nickname: { type: string }
        avatarUrl: { type: string, nullable: true }
        lastPlayedAt: { type: string, format: date-time }
        playCount: { type: integer }
        friend: { type: boolean }
    ReportReason:
      type: string
      enum: [ABUSIVE_LANGUAGE, HARASSMENT, CHEATING, TROLLING_OR_AFK, INAPPROPRIATE_PROFILE, OTHER]
    CreateReportRequest:
      type: object
      required: [targetUserId, reason]
      properties:
        targetUserId: { type: string, format: uuid }
        reason: { $ref: '#/components/schemas/ReportReason' }
        description: { type: string, maxLength: 1000, nullable: true }
        partyId: { type: string, format: uuid, nullable: true }
    VoicePreference:
      type: string
      enum: [REQUIRED, OPTIONAL, NO_VOICE]
    PlayPurpose:
      type: string
      enum: [RANK_UP, NORMAL, FUN]
    KeyCondition:
      type: object
      required: [type, value]
      properties:
        type:
          type: string
          enum: [POSITION, ROLE, PLAY_STYLE]
        value: { type: string }
    MatchCondition:
      type: object
      required: [game, modeKey, keyCondition, voicePreference, playPurpose]
      properties:
        game: { $ref: '#/components/schemas/GameKey' }
        modeKey: { type: string }
        keyCondition: { $ref: '#/components/schemas/KeyCondition' }
        voicePreference: { $ref: '#/components/schemas/VoicePreference' }
        playPurpose: { $ref: '#/components/schemas/PlayPurpose' }
    CreateMatchRequest:
      allOf:
        - $ref: '#/components/schemas/MatchCondition'
    MatchRequestView:
      type: object
      required: [id, status, queuedAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [QUEUED, PROPOSED, MATCHED, CANCELLED, EXPIRED] }
        queuedAt:
          type: string
          format: date-time
          description: 최초 대기 시작 시각. 제안을 거절하고 큐로 돌아와도 유지된다
        proposalId: { type: string, format: uuid, nullable: true }
    PlayAmount:
      type: string
      enum: [ONE_GAME, TWO_PLUS]
    CreateReservationRequest:
      type: object
      required: [condition, availableFrom, availableTo, playAmount]
      properties:
        condition: { $ref: '#/components/schemas/MatchCondition' }
        availableFrom: { type: string, format: date-time }
        availableTo: { type: string, format: date-time }
        playAmount: { $ref: '#/components/schemas/PlayAmount' }
    ReservationView:
      type: object
      required: [id, status, condition, availableFrom, availableTo, playAmount]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, PROPOSED, MATCHED, CANCELLED, EXPIRED, COMPLETED] }
        condition: { $ref: '#/components/schemas/MatchCondition' }
        availableFrom: { type: string, format: date-time }
        availableTo: { type: string, format: date-time }
        playAmount: { $ref: '#/components/schemas/PlayAmount' }
        createdAt: { type: string, format: date-time }
        scheduledStart: { type: string, format: date-time, nullable: true }
        proposalId: { type: string, format: uuid, nullable: true }
        partyId: { type: string, format: uuid, nullable: true }
    ProposalMember:
      type: object
      properties:
        userId: { type: string, format: uuid }
        nickname: { type: string }
        acceptance: { type: string, enum: [PENDING, ACCEPTED, DECLINED] }
    ProposalView:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, CONFIRMED, DECLINED, EXPIRED, CANCELLED] }
        expiresAt: { type: string, format: date-time }
        members:
          type: array
          items: { $ref: '#/components/schemas/ProposalMember' }
        partyId: { type: string, format: uuid, nullable: true }
    PartyView:
      type: object
      properties:
        id: { type: string, format: uuid }
        game: { $ref: '#/components/schemas/GameKey' }
        modeKey: { type: string }
        targetSize: { type: integer }
        status:
          type: string
          enum: [OPEN, READY, PLAYING, CLOSED]
          description: OPEN 모이는 중, READY 전원 준비, PLAYING 게임 중, CLOSED 종료
        members:
          type: array
          items:
            type: object
            properties:
              userId: { type: string, format: uuid }
              nickname: { type: string }
              ready: { type: boolean }
