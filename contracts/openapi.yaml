# 출처: queueMate 저장소 / 브랜치 feature/frontend / 경로 contracts/openapi.yaml (662줄)
# 커밋: 825d673
#
# ★ 발췌본이다. app:matching 이 노출하는 엔드포인트와 그에 필요한 스키마만 옮겼다.
#   auth / users / reservations / parties / friends / blocks / recent-players / reports 는
#   app:platform 소관이라 뺐다. 전문이 필요하면 원본을 봐라.
#
# ★ 이 파일은 "계약"이고 현재 코드가 아니다. 코드와 어긋나는 지점은 contracts/README.md
#   의 불일치 표에 정리돼 있다. 임의로 어느 한쪽에 맞추지 마라.

openapi: 3.0.3
info:
  title: QueueMate API — app:matching 발췌
  version: 1.0.0
servers:
  - url: /api/v1

# > 개정 이력: 2026-09-27 — 이 사본이 원본보다 앞서간 변경이다 (contracts/README.md A-12).
#   인증은 쿠키 qm_access 의 access 토큰(RS256 JWT)이다. app:platform 이 발급하고 이 앱은 공개 키로 검증만 한다
#   (서명 · exp · iss=queuemate-platform · token_use=access · sub 가 숫자 문자열). "나"는 sub 다 —
#   요청 바디의 userId 와 쿼리 파라미터 ?userId= 는 없어졌다 (docs/11 D-14 · D-24 · D-25).
#   실패는 401 UNAUTHENTICATED 하나. 상태를 바꾸는 요청은 Origin 이 허용 목록 밖이면 403 ORIGIN_NOT_ALLOWED.
security:
  - cookieAuth: []

paths:
  # ── gameconfig ────────────────────────────────────────────────
  /games:
    get:
      summary: Supported games
      description: |
        app:matching 이 gameconfig 모듈을 포함하므로 이 앱 소관이다.
        [미구현] 이 저장소에 해당 컨트롤러가 없다.
      responses:
        '200':
          description: OK

  # ── 실시간 매칭 ────────────────────────────────────────────────
  /match-requests:
    post:
      summary: Start realtime matching
      description: |
        [구현됨] MatchingController#createMatchRequest
        INV-1 위반 시 409.
        Redis 장애 시 503 (INV-10 fail-closed) — 원본 계약에는 없는 응답이다.
        요청한 사람은 쿠키의 sub 다 (2026-09-27 — 그 전에는 바디의 userId).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMatchRequest' }
      responses:
        '201':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchRequestView' }
        '400': { description: Invalid match condition }
        '401': { description: Missing or invalid qm_access cookie (UNAUTHENTICATED) }
        '403': { description: Origin not allowed (ORIGIN_NOT_ALLOWED) }
        '409': { description: User already has active request (ALREADY_QUEUED) or is in a board room (IN_ROOM) }
        '503': { description: Matching unavailable (Redis down, fail-closed) }

  /match-requests/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Match request status
      description: |
        [미구현] 이 저장소에 @GetMapping 이 없다.
        SSE 경로도 없으므로 현재 클라이언트가 매칭 진행 상황을 알 수단이 전혀 없다.
        contracts/README.md "가장 큰 구멍" 참고.
        (2026-09-17 이후: 구현은 경로 변수 없는 GET /match-requests 로 조회한다 — contracts/README.md #5.
         2026-09-27 부터 "나"는 쿠키의 sub 이고 ?userId= 는 없다)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchRequestView' }
    delete:
      summary: Cancel realtime matching
      description: |
        [구현됨] MatchingController#cancelMatchRequest
        compare-and-delete — 저장된 requestId 와 경로 id 가 같을 때만 지운다.
        누구의 요청인지는 쿠키의 sub 다. (2026-09-27 까지 구현은 계약에 없는 userId 쿼리
        파라미터를 요구했다 — JWT 도입 전 임시. 지금은 없다)
      responses:
        '204': { description: Cancelled }
        '401': { description: Missing or invalid qm_access cookie (UNAUTHENTICATED) }
        '403': { description: Origin not allowed (ORIGIN_NOT_ALLOWED) }
        '404': { description: No active request, or requestId mismatch }
        '503': { description: Matching unavailable (Redis down, fail-closed) }

  # ── proposal ─────────────────────────────────────────────────
  /proposals/{id}/accept:
    post:
      summary: Accept proposal
      description: |
        [미구현] INV-4 / INV-5 를 지킬 수락 집계 Lua 가 아직 없다 (docs/11 #28).
        (이후 구현됨 — contracts/README.md #6. 수락하는 사람은 쿠키의 sub 다 — 2026-09-27 까지는 ?userId=)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Acceptance updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProposalView' }

  /proposals/{id}/decline:
    post:
      summary: Decline proposal
      description: |
        [미구현] (이후 구현됨 — contracts/README.md #6. 거절하는 사람은 쿠키의 sub 이고 ?requestId= 를 받는다.
        2026-09-27 까지는 ?userId= 도 받았다)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Declined }

components:
  securitySchemes:
    # 2026-09-27 — contracts/README.md A-12. 발급은 app:platform (Set-Cookie: qm_access; HttpOnly; SameSite=Lax; Path=/)
    cookieAuth:
      type: apiKey
      in: cookie
      name: qm_access

  schemas:
    GameKey:
      type: string
      enum: [LOL, VALORANT, PUBG]

    VoicePreference:
      type: string
      # ⚠ 원본 계약은 [REQUIRED, OPTIONAL, NO_VOICE] 세 값이다.
      #   코드(domain/VoicePreference.java)는 OPTIONAL 을 제거했고 그쪽이 맞다.
      #   원본 계약이 낡았다. 여기에는 원본 값을 그대로 두고 불일치만 표시한다.
      enum: [REQUIRED, OPTIONAL, NO_VOICE]

    PlayPurpose:
      type: string
      enum: [RANK_UP, NORMAL, FUN]

    KeyCondition:
      type: object
      required: [type, value]
      properties:
        type:
          type: string
          enum: [POSITION, ROLE, PLAY_STYLE]
        value: { type: string }

    MatchCondition:
      type: object
      required: [game, modeKey, keyCondition, voicePreference, playPurpose]
      properties:
        game: { $ref: '#/components/schemas/GameKey' }
        modeKey: { type: string }
        keyCondition: { $ref: '#/components/schemas/KeyCondition' }
        voicePreference: { $ref: '#/components/schemas/VoicePreference' }
        playPurpose: { $ref: '#/components/schemas/PlayPurpose' }

    CreateMatchRequest:
      allOf:
        - $ref: '#/components/schemas/MatchCondition'
      # ⚠ 구현은 여기에 한 필드를 더 받는다 (2026-09-11 확인 · 2026-09-27 갱신).
      #   (userId (필수, String)     — JWT 도입 전 임시 필드였다. 2026-09-27 에 없어졌다 — 쿠키의 sub 가 대신한다.
      #                                 보내도 무시된다)
      #   tier   (선택, String)      — 랭크 티어. gameconfig 의 tierRule 이 NONE 이 아닌
      #                                모드에서는 사실상 필수이고, 빠지면 400 이다.
      #                                조건이 아니라 derived/자격 조건이다 (docs/02 §6).
      #                                라이엇 계정 연동이 붙으면 사라진다.

    MatchRequestView:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [QUEUED, PROPOSED, MATCHED, CANCELLED, EXPIRED] }
        queuedAt: { type: string, format: date-time }
        proposalId: { type: string, format: uuid, nullable: true }
      # ⚠ 구현(dto/MatchRequestResponse.java)은 { requestId, status } 두 필드만 돌려준다.
      #   필드명도 id 가 아니라 requestId 다.

    ProposalMember:
      type: object
      properties:
        userId: { type: string, format: uuid }
        nickname: { type: string }
        acceptance: { type: string, enum: [PENDING, ACCEPTED, DECLINED] }

    ProposalView:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, CONFIRMED, DECLINED, EXPIRED, CANCELLED] }
        expiresAt: { type: string, format: date-time }
        members:
          type: array
          items: { $ref: '#/components/schemas/ProposalMember' }
        partyId: { type: string, format: uuid, nullable: true }

    # ⚠ 원본 계약에는 ErrorResponse 스키마가 없다 (원본 contracts/events.md 의
    #   "미해결 계약 구멍"이 직접 지적한다). 아래는 구현
    #   common/error/ErrorResponse.java 에서 역으로 적은 것이며, 계약으로 승격하려면
    #   queueMate 본 저장소에서 contract 변경 커밋을 먼저 만들어야 한다.
    ErrorResponse:
      type: object
      required: [code, message, details]
      properties:
        code:
          type: string
          # 이 저장소가 실제로 내는 값
          enum:
            - INVALID_REQUEST          # @Valid 실패
            - BAD_REQUEST              # 지원하지 않는 게임 등
            - INVALID_MATCH_CONDITION  # 게임별 조건 검증 실패
            - ALREADY_QUEUED           # INV-1
            - IN_ROOM                  # 게시판 방에 들어가 있다 (docs/11 D-11 15번) — contracts/README.md A-10
            - MATCH_REQUEST_NOT_FOUND
            - MATCH_REQUEST_MISMATCH
            - MATCHING_UNAVAILABLE     # INV-10 fail-closed
            - UNAUTHENTICATED          # 401 — 쿠키 qm_access 가 없거나 검증 실패 (2026-09-27, A-12)
            - ORIGIN_NOT_ALLOWED       # 403 — 상태 변경 요청의 Origin 이 허용 목록 밖 (2026-09-27, A-12)
        message: { type: string }
        details:
          type: array
          items: { type: string }
